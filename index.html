<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kusunoki Fitness</title>
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kusunoki">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#111418; --card:#1b2027; --card2:#232a33; --line:#2e3742;
  --text:#eef1f5; --muted:#9aa5b1; --accent:#ff7a3d; --accent2:#3dd6a3;
  --danger:#ff5a5f; --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;flex:1}
.switch{display:flex;background:var(--card);border-radius:999px;padding:3px}
.switch button{padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.switch button.on{background:var(--accent);color:#111}
main{padding:16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
h2{font-size:22px;margin:4px 0 2px}
h3{font-size:16px;margin:0}
.pill{display:inline-block;background:var(--card2);color:var(--muted);border-radius:999px;padding:3px 10px;font-size:13px}
.pill.acc{background:rgba(255,122,61,.15);color:var(--accent)}
.btn{background:var(--accent);color:#111;font-weight:700;border-radius:12px;padding:12px 16px;width:100%}
.btn.sec{background:var(--card2);color:var(--text);font-weight:600}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;border-radius:10px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.ex{display:flex;gap:12px;align-items:flex-start}
.ex .chk{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin-top:2px}
.ex.done .chk{background:var(--accent2);border-color:var(--accent2);color:#111}
.ex.done .name{text-decoration:line-through;color:var(--muted)}
.ex .body{flex:1;min-width:0}
.ex .name{font-weight:650}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.load{font-weight:700;color:var(--accent)}
.swapped{font-size:12px;color:var(--accent2)}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(17,20,24,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;padding:8px 0;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.tabs button{flex:none;background:var(--card);border-radius:12px;padding:10px 14px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--accent);color:#111}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font-size:18px;margin-bottom:12px}
.list button.item{display:flex;width:100%;text-align:left;padding:12px;border-radius:12px;background:var(--card2);margin-bottom:8px;align-items:center;gap:10px}
.list button.item .grow{flex:1}
label.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px}
.timer{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:7;background:var(--accent2);color:#111;font-weight:800;border-radius:999px;padding:12px 18px;font-size:20px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:#000;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.week div{background:var(--card2);border-radius:10px;padding:8px 2px;text-align:center;font-size:12px}
.week div b{display:block;font-size:15px}
.week div.today{outline:2px solid var(--accent)}
.week div.did{background:rgba(61,214,163,.2)}
.warn{color:#ffc65c;font-size:12px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.mv{padding:6px 8px;color:var(--muted)}
.meta.tap{cursor:pointer}
.meta.tap .pill{border:1px dashed var(--line)}
.pill.adj{background:rgba(61,214,163,.15);color:var(--accent2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:var(--card2);border-radius:10px;padding:8px 12px;font-weight:600;color:var(--muted)}
.chips button.on{background:var(--accent);color:#111}
.stepper{display:flex;align-items:center;gap:16px;justify-content:center;margin:10px 0}
.stepper button{width:44px;height:44px;border-radius:50%;background:var(--card2);font-size:22px;font-weight:700}
.stepper b{font-size:28px;min-width:40px;text-align:center}
.cmp{display:grid;grid-template-columns:70px 1fr 54px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.cmp .bar{height:12px;border-radius:6px;background:var(--card2);overflow:hidden}
.cmp .bar i{display:block;height:100%;border-radius:6px}
.vol{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.pill.ok{background:rgba(61,214,163,.15);color:var(--accent2)}
.pill.low{background:rgba(255,198,92,.15);color:#ffc65c}
.pill.high{background:rgba(255,90,95,.15);color:var(--danger)}
textarea{min-height:90px;resize:vertical}
</style>
</head>
<body>
<header>
  <h1>Kusunoki Fitness</h1>
  <div class="switch" id="who"></div>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="overlay"></div>

<script>
/* ---------- Biblioteca de exercícios ---------- */
// g = grupo (usado para sugerir trocas). lomb = coloca carga na lombar.
const LIB = [
 // Peito
 ['Supino reto com barra','peito',0],['Supino reto com halteres','peito',0],['Supino na máquina','peito',0],
 ['Supino inclinado com halteres','peito',0],['Supino inclinado com barra','peito',0],['Supino inclinado na máquina','peito',0],
 ['Voador no crossover','peito',0],['Voador na máquina (peck deck)','peito',0],['Crucifixo com halteres','peito',0],
 ['Flexão de braço','peito',0],['Crossover polia baixa','peito',0],
 // Costas
 ['Barra fixa','costas',0],['Barra fixa assistida (graviton)','costas',0],['Puxada pronada','costas',0],
 ['Puxada neutra na máquina','costas',0],['Puxada supinada','costas',0],['Remada baixa no cabo','costas',0],
 ['Remada máquina com apoio no peito','costas',0],['Remada unilateral com halter (apoiado)','costas',0],
 ['Remada curvada com barra','costas',1],['Pulldown com corda','costas',0],
 // Ombro
 ['Elevação lateral com halteres','ombro',0],['Elevação lateral no cabo','ombro',0],['Elevação lateral na máquina','ombro',0],
 ['Desenvolvimento com halteres (sentado com encosto)','ombro',0],['Desenvolvimento na máquina','ombro',0],
 ['Desenvolvimento militar em pé','ombro',1],['Elevação frontal','ombro',0],['Face pull','ombro',0],
 ['Crucifixo inverso na máquina','ombro',0],
 // Bíceps
 ['Rosca direta com barra','biceps',0],['Rosca alternada com halteres','biceps',0],['Rosca martelo','biceps',0],
 ['Rosca concentrada','biceps',0],['Rosca Scott','biceps',0],['Rosca no cabo','biceps',0],['Rosca inclinada com halteres','biceps',0],
 // Tríceps
 ['Tríceps corda na polia','triceps',0],['Tríceps barra na polia','triceps',0],['Tríceps francês sentado','triceps',0],
 ['Tríceps testa','triceps',0],['Tríceps no banco (mergulho)','triceps',0],['Tríceps unilateral no cabo','triceps',0],
 // Quadríceps
 ['Cadeira extensora','quadriceps',0],['Cadeira extensora unilateral','quadriceps',0],['Leg press 45°','quadriceps',1],['Leg press horizontal','quadriceps',0],
 ['Agachamento livre','quadriceps',1],['Agachamento no Smith','quadriceps',1],['Hack machine','quadriceps',1],
 ['Afundo com halteres','quadriceps',0],['Passada (avanço) com halteres','quadriceps',0],['Agachamento búlgaro','quadriceps',0],
 ['Cadeira adutora','quadriceps',0],
 // Posterior
 ['Mesa flexora (flexora deitada)','posterior',0],['Cadeira flexora','posterior',0],['Flexora em pé unilateral','posterior',0],
 ['Stiff com halteres','posterior',1],['Levantamento terra (deadlift)','posterior',1],['Levantamento terra romeno','posterior',1],
 // Glúteo
 ['Elevação pélvica','gluteo',0],['Elevação pélvica na máquina','gluteo',0],['Cadeira abdutora','gluteo',0],
 ['Glúteo no cabo (coice)','gluteo',0],['Glúteo na máquina (coice)','gluteo',0],['Abdução no cabo','gluteo',0],
 // Panturrilha
 ['Panturrilha sentado','panturrilha',0],['Panturrilha em pé na máquina','panturrilha',1],['Panturrilha no leg press','panturrilha',0],
 // Abdômen
 ['Abdominal na máquina','abdomen',0],['Abdominal supra no solo','abdomen',0],['Prancha','abdomen',0],
 ['Elevação de pernas','abdomen',0],['Abdominal no cabo (crunch)','abdomen',0],
 // Lombar
 ['Extensão lombar no banco romano','lombar',0],['Extensão lombar na máquina','lombar',0],['Superman (solo)','lombar',0],
].map(([n,g,l])=>({n,g,lomb:!!l}));
const GROUPS={peito:'Peito',costas:'Costas',ombro:'Ombro',biceps:'Bíceps',triceps:'Tríceps',quadriceps:'Quadríceps / pernas',posterior:'Posterior de coxa',gluteo:'Glúteo',panturrilha:'Panturrilha',abdomen:'Abdômen',lombar:'Lombar',outro:'Outro'};
const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

/* ---------- Treinos iniciais ---------- */
const E=(n,s,r,rest=75,note='')=>({n,s,r,rest,note});
let _id=0; const uid=()=>Date.now().toString(36)+(_id++).toString(36);
function seed(){
  const leo={name:'Leonardo',kg:85,cm:180,avoidLumbar:true,mode:'semana',loads:{},history:[],
   workouts:[
    {id:'A',title:'Peito e tríceps',ex:[E('Supino reto com barra',4,'8-10',90),E('Supino inclinado com halteres',3,'8-12',90),E('Voador no crossover',3,'12-15',60),E('Tríceps corda na polia',3,'10-12',60),E('Tríceps francês sentado',3,'10-12',60)]},
    {id:'B',title:'Costas e bíceps',ex:[E('Barra fixa',4,'6-10',90),E('Puxada pronada',3,'8-12',75),E('Puxada neutra na máquina',3,'10-12',75),E('Remada máquina com apoio no peito',3,'10-12',75,'Apoio no peito protege a lombar'),E('Rosca direta com barra',3,'8-12',60),E('Rosca martelo',3,'10-12',60)]},
    {id:'C',title:'Quadríceps',ex:[E('Cadeira extensora',6,'12-15 / 8-10',75,'Único de anterior: 3 séries de 12-15 leves, depois 3 de 8-10 pesadas. Última série pode ser drop-set'),E('Cadeira extensora unilateral',3,'12-15',60,'Uma perna por vez, pausa de 1s em cima'),E('Passada (avanço) com halteres',3,'10 cada perna',75,'Carga leve, tronco reto. Pule se incomodar a lombar'),E('Cadeira adutora',3,'15',60),E('Panturrilha sentado',4,'12-15',45)]},
    {id:'D',title:'Posterior e glúteo',ex:[E('Mesa flexora (flexora deitada)',4,'10-12',75),E('Cadeira flexora',3,'10-12',60),E('Flexora em pé unilateral',3,'12 cada perna',45),E('Elevação pélvica na máquina',4,'10-12',75,'Apoio nas costas, sem arquear a lombar'),E('Cadeira abdutora',3,'15',45),E('Glúteo na máquina (coice)',3,'12 cada perna',45)]},
    {id:'E',title:'Complementar: ombro e braços',ex:[E('Elevação lateral com halteres',4,'12-15',45),E('Desenvolvimento com halteres (sentado com encosto)',3,'8-12',75),E('Face pull',3,'12-15',60),E('Rosca concentrada',4,'10-12',45),E('Tríceps testa',4,'10-12',60),E('Abdominal na máquina',3,'15-20',45)]},
   ],
   schedule:{1:'A',2:'B',3:'C',4:'D',5:'E',6:null,0:null}};
  const hel={name:'Helena',kg:53,cm:158,avoidLumbar:false,mode:'semana',loads:{},history:[],
   workouts:[
    {id:'A',title:'Posterior e glúteo',ex:[E('Elevação pélvica',4,'8-12',90),E('Levantamento terra romeno',3,'8-10',90),E('Mesa flexora (flexora deitada)',3,'10-12',60),E('Agachamento búlgaro',3,'10 cada perna',75),E('Cadeira abdutora',3,'15',45),E('Cadeira flexora',3,'12',60)]},
    {id:'B',title:'Peito e costas',ex:[E('Puxada pronada',3,'10-12',75),E('Barra fixa assistida (graviton)',3,'8-10',75),E('Supino reto com halteres',3,'10-12',75),E('Remada baixa no cabo',3,'10-12',60),E('Voador no crossover',3,'12-15',60),E('Abdominal supra no solo',3,'15-20',45)]},
    {id:'C',title:'Anterior completo',ex:[E('Agachamento livre',4,'8-10',90),E('Leg press 45°',3,'10-12',90),E('Cadeira extensora',3,'12-15',60),E('Passada (avanço) com halteres',3,'10 cada perna',75),E('Cadeira adutora',3,'15',45),E('Panturrilha em pé na máquina',4,'12-15',45)]},
    {id:'D',title:'Bíceps, tríceps e ombro',ex:[E('Desenvolvimento com halteres (sentado com encosto)',3,'10-12',75),E('Elevação lateral com halteres',4,'12-15',45),E('Tríceps francês sentado',3,'10-12',60),E('Tríceps corda na polia',3,'12',45),E('Rosca direta com barra',3,'10-12',60),E('Rosca concentrada',3,'10-12',45),E('Prancha',3,'30-45s',45)]},
   ],
   schedule:{1:'A',2:'B',3:'C',4:'D',5:null,6:null,0:null}};
  return {v:4,active:'leo',profiles:{leo,hel},custom:[],session:null,ideas:[]};
}

/* ---------- Estado ---------- */
const KEY='kusunoki-fitness-v1';
let S; try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.profiles) S=seed();
// Atualizações de treino para quem já usa o app
if((S.v||1)<2){
  const c=S.profiles.leo&&S.profiles.leo.workouts.find(w=>w.id==='C');
  const e=c&&c.ex.find(x=>x.n==='Cadeira extensora');
  if(e&&e.s<6){e.s=6;e.r='12-15 / 8-10';e.note='Único de anterior: 3 séries de 12-15 leves, depois 3 de 8-10 pesadas. Última série pode ser drop-set'}
  S.v=2;
}
if(S.v<3){
  const b={leo:[85,180],hel:[53,158]};
  for(const k in b) if(S.profiles[k]&&!S.profiles[k].kg){S.profiles[k].kg=b[k][0];S.profiles[k].cm=b[k][1]}
  S.ideas=S.ideas||[]; S.v=3;
}
const save=(noSync)=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){};if(!noSync)syncSoon()};
if(S.v<4){
  // divide as pernas do Leonardo: C quadríceps, D posterior e glúteo, antigo D vira E
  const p=S.profiles.leo;
  if(p&&!p.workouts.some(w=>/posterior/i.test(w.title))&&p.workouts.some(w=>w.id==='C'&&/pernas/i.test(w.title))&&!p.workouts.some(w=>w.id==='E')){
    const nw=seed().profiles.leo.workouts, oldD=p.workouts.find(w=>w.id==='D');
    p.workouts=p.workouts.map(w=>w.id==='C'?nw[2]:w.id==='D'?nw[3]:w);
    if(oldD){oldD.id='E';oldD.ex.forEach(e=>{if(/rosca concentrada|tríceps unilateral|tríceps testa/i.test(e.n))e.s=Math.max(e.s,4)});p.workouts.push(oldD)}
    p.schedule={1:'A',2:'B',3:'C',4:'D',5:'E',6:null,0:null};
  }
  S.v=4; save(true);
}
const P=()=>S.profiles[S.active];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const allEx=()=>LIB.concat(S.custom);
const exInfo=n=>allEx().find(x=>x.n===n)||{n,g:'outro',lomb:false};
const lastLoad=n=>{const l=P().loads[n];return l&&l.length?l[l.length-1]:null};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>{const[y,m,dd]=d.split('-');return dd+'/'+m};

let view='hoje', planSel=null, viewW=null;

/* ---------- Treino sugerido ---------- */
function suggested(){
  const p=P();
  if(p.mode==='sequencia'){
    const last=p.history[p.history.length-1];
    if(!last) return p.workouts[0]?.id||null;
    if(last.d===today()) return last.w;
    const i=p.workouts.findIndex(w=>w.id===last.w);
    return p.workouts[(i+1)%p.workouts.length]?.id||null;
  }
  return p.schedule[new Date().getDay()]||null;
}
const W=id=>{if(id==='J'){const t=S.together;return t&&t.d===today()&&t.p===S.active?t.tw:null}return P().workouts.find(w=>w.id===id)};
const MAIN=['peito','costas','ombro','biceps','triceps','quadriceps','posterior','gluteo'];
const otherKey=()=>Object.keys(S.profiles).find(k=>k!==S.active);

// sessão do dia: trocas temporárias e exercícios marcados
function sess(wid){
  const s=S.session;
  if(!s||s.d!==today()||s.p!==S.active||s.w!==wid){
    // guarda o treino atual do dia e recupera o que já foi marcado no outro (vale só para hoje)
    const all=(S.sessAll||{}),keep={};for(const k in all) if(all[k].d===today()) keep[k]=all[k];
    if(s&&s.d===today()) keep[s.p+'|'+s.w]=s;
    const k=S.active+'|'+wid;
    S.session=keep[k]||{d:today(),p:S.active,w:wid,swaps:{},done:{},adj:{}};delete keep[k];
    S.sessAll=keep;save(true);}
  S.session.adj=S.session.adj||{};S.session.extras=S.session.extras||[];
  return S.session;
}

/* ---------- Render ---------- */
function render(){
  document.getElementById('who').innerHTML=Object.entries(S.profiles).map(([k,p])=>`<button class="${k===S.active?'on':''}" onclick="setWho('${k}')">${esc(p.name)}</button>`).join('');
  const navs=[['hoje','Hoje','M4 6h16M4 12h16M4 18h10'],['plano','Treinos','M6 4v16M18 4v16M3 9h6M15 9h6M3 15h6M15 15h6M9 12h6'],['progresso','Progresso','M4 20V10M10 20V4M16 20v-7M22 20H2'],['ajustes','Ajustes','M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 14.1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z']];
  document.getElementById('nav').innerHTML=navs.map(([k,l,d])=>`<button class="${view===k?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>${l}</button>`).join('');
  const app=document.getElementById('app');

function weekStrip(){
  const p=P(),now=new Date(),start=new Date(now);start.setDate(now.getDate()-((now.getDay()+6)%7));
  let h='<div class="week">';
  for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const did=p.history.some(x=>x.d===ds);
    const lab=p.mode==='semana'?(p.schedule[d.getDay()]||'–'):(p.history.find(x=>x.d===ds)?.w||'·');
    h+=`<div class="${ds===today()?'today':''} ${did?'did':''}">${DIAS[d.getDay()]}<b>${esc(lab)}</b></div>`}
  return h+'</div>';
}

/* ---------- Volume e equivalência ---------- */
// média das repetições de um texto como "12-15" ou "10 cada perna". Tempo (ex: "30-45s") não conta.
function repsAvg(r){r=String(r);if(/\d\s*s\b/i.test(r)&&!/s[ée]rie/i.test(r))return null;const n=(r.match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>parseFloat(x.replace(',','.')));return n.length?n.reduce((a,b)=>a+b,0)/n.length:null}
const kgNum=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
// Fórmula de Epley: mesma intensidade relativa -> carga para r reps = 1RM / (1 + r/30)
const epley=r=>1+r/30;
function equiv(s0,r0,r1,kg0){
  const sets=s0*r0*epley(r1)/(r1*epley(r0));
  const kg=kg0!=null?Math.round(kg0*epley(r0)/epley(r1)*2)/2:null;
  return {sets,kg};
}
// exercícios feitos de fato hoje (com trocas, ajustes e extras). Se nada foi marcado, conta tudo.
function sessEx(wid){
  const w=W(wid),s=S.session&&S.session.w===wid&&S.session.d===today()?S.session:{swaps:{},done:{},adj:{},extras:[]};
  const all=w.ex.map((e,i)=>{const a=(s.adj||{})[i];return {k:i,n:s.swaps[i]||e.n,s:a?a.s:e.s,r:a?a.r:e.r,kg:a&&a.kg}})
    .concat((s.extras||[]).map((e,j)=>({k:'x'+j,n:e.n,s:e.s,r:e.r})));
  const anyDone=Object.values(s.done||{}).some(Boolean);
  return anyDone?all.filter(x=>s.done[x.k]):all;
}
function workVolume(wid){
  let v=0;sessEx(wid).forEach(x=>{const r=repsAvg(x.r),ll=lastLoad(x.n),kg=x.kg||(ll?kgNum(ll.kg):null);if(r&&kg)v+=x.s*r*kg});
  return Math.round(v);
}
function groupSets(list){const g={};list.forEach(x=>{const k=exInfo(x.n).g;g[k]=(g[k]||0)+(+x.s||0)});return g}
const RANGES=['6-8','8-10','10-12','12-15','15-20'];
let adjState=null;
function adjSheet(wid,i){
  const e=W(wid).ex[i],s=sess(wid),a=s.adj[i];
  adjState={wid,i,r:a?a.r:null,s:a?a.s:null};
  drawAdj();
}
function drawAdj(){
  const {wid,i}=adjState,e=W(wid).ex[i],s=sess(wid),name=s.swaps[i]||e.n;
  const r0=repsAvg(e.r),ll=lastLoad(name),kg0=ll?kgNum(ll.kg):null;
  if(!r0){sheet(`<h3>${esc(name)}</h3><p class="muted">Esse exercício é por tempo, então não dá para calcular equivalência.</p><button class="btn ghost" onclick="closeSheet()">Fechar</button>`);return}
  let body='';
  if(adjState.r){
    const r1=repsAvg(adjState.r),q=equiv(e.s,r0,r1,kg0);
    if(adjState.s==null) adjState.s=Math.max(1,Math.round(q.sets));
    const pct=Math.round(adjState.s/q.sets*100);
    body=`<div class="card" style="background:var(--card2);margin-top:12px;text-align:center">
      <div class="muted small">Séries de ${esc(adjState.r)}</div>
      <div class="stepper"><button onclick="adjState.s=Math.max(1,adjState.s-1);drawAdj()" aria-label="Menos">−</button><b>${adjState.s}</b><button onclick="adjState.s++;drawAdj()" aria-label="Mais">+</button></div>
      <div class="small">Equivalente ao plano: <b>${Math.round(q.sets*10)/10} séries</b> · você fica com <b style="color:${pct<90?'#ffc65c':pct>115?'var(--danger)':'var(--accent2)'}">${pct}%</b> do trabalho</div>
      ${q.kg!=null?`<div class="small" style="margin-top:6px">Carga sugerida: <span class="load">~${q.kg} kg</span> <span class="muted">(última ${esc(ll.kg)} kg)</span></div>`:'<div class="muted small" style="margin-top:6px">Registre uma carga para ver a carga sugerida.</div>'}
    </div>
    <button class="btn" onclick="saveAdj(${q.kg!=null?q.kg:'null'})">Usar hoje</button>`;
  }
  sheet(`<h3>${esc(name)}</h3><div class="muted small">Plano: ${e.s} séries de ${esc(e.r)}. Escolha as repetições de hoje:</div>
    <div class="chips" style="margin-top:10px">${RANGES.map(r=>`<button class="${adjState.r===r?'on':''}" onclick="adjState.r='${r}';adjState.s=null;drawAdj()">${r}</button>`).join('')}</div>
    ${body}
    ${s.adj[i]?`<div style="height:8px"></div><button class="btn ghost" onclick="delete sess('${wid}').adj[${i}];save();closeSheet();render()">Voltar ao plano</button>`:''}
    <div class="muted small" style="margin-top:12px">O cálculo mantém o mesmo trabalho total (séries × repetições × carga), ajustando a carga para a nova faixa de repetições.</div>`);
}
function saveAdj(kg){const {wid,i}=adjState;sess(wid).adj[i]={s:adjState.s,r:adjState.r,kg};save();closeSheet();toast('Ajustado só para hoje');render()}

/* ---------- Carga ---------- */
function askLoad(enc){
  const n=decodeURIComponent(enc); const ll=lastLoad(n); const hist=(P().loads[n]||[]).slice(-6).reverse();
  sheet(`<h3>${esc(n)}</h3>
   <label class="f">Carga (kg)</label>
   <input id="kg" type="text" inputmode="decimal" placeholder="${ll?esc(ll.kg):'ex: 20'}" value="${ll?esc(ll.kg):''}">
   <div class="muted small" style="margin-top:6px">Dica: pode escrever "2x12" para halteres ou "placa 5" se preferir.</div>
   <div class="actions"><button class="btn" onclick="saveLoad('${enc}')">Salvar carga</button></div>
   ${hist.length?`<hr><div class="muted small">Histórico</div>${hist.map(x=>`<div class="row small" style="justify-content:space-between;padding:6px 0"><span>${fmtDate(x.d)}</span><b>${esc(x.kg)} kg</b></div>`).join('')}`:''}`);
  setTimeout(()=>{const i=document.getElementById('kg');i&&i.select()},50);
}
function saveLoad(enc){
  const n=decodeURIComponent(enc); const v=document.getElementById('kg').value.trim().replace(/\s*kg$/i,'');
  if(!v){closeSheet();return}
  const p=P(); p.loads[n]=p.loads[n]||[];
  const arr=p.loads[n]; if(arr.length&&arr[arr.length-1].d===today()) arr[arr.length-1].kg=v; else arr.push({d:today(),kg:v});
  save();closeSheet();toast('Carga salva');render();
}

/* ---------- Trocar exercício ---------- */
function swapSheet(wid,i,fromToday){
  const w=W(wid); const e=w.ex[i]; const cur=fromToday?(sess(wid).swaps[i]||e.n):e.n;
  const info=exInfo(e.n); const p=P();
  const sugg=allEx().filter(x=>x.g===info.g&&x.n!==cur);
  const item=x=>`<button class="item" onclick="doSwap('${wid}',${i},'${encodeURIComponent(x.n)}',${fromToday})"><span class="grow">${esc(x.n)}${p.avoidLumbar&&x.lomb?' <span class="warn">⚠ lombar</span>':''}</span><span class="muted small">${lastLoad(x.n)?esc(lastLoad(x.n).kg)+' kg':''}</span></button>`;
  const okS=sugg.filter(x=>!(p.avoidLumbar&&x.lomb)), badS=sugg.filter(x=>p.avoidLumbar&&x.lomb);
  sheet(`<h3>Trocar ${esc(cur)}</h3>
   <div class="muted small" style="margin-bottom:10px">Sugestões de ${esc(GROUPS[info.g]||'')}</div>
   <div class="list">${okS.map(item).join('')||'<div class="muted">Sem sugestões nesse grupo.</div>'}
   ${badS.length?`<details><summary class="muted small" style="padding:8px 0">Mostrar ${badS.length} que carregam a lombar</summary>${badS.map(item).join('')}</details>`:''}
   ${fromToday&&sess(wid).swaps[i]?`<button class="item" onclick="doSwap('${wid}',${i},'',true)"><span class="grow">↩ Voltar ao original (${esc(e.n)})</span></button>`:''}
   </div>
   <hr><button class="btn ghost" onclick="pickAny('${wid}',${i},${fromToday})">Escolher outro exercício…</button>`);
}
function doSwap(wid,i,enc,fromToday){
  const n=decodeURIComponent(enc);
  if(!fromToday){W(wid).ex[i].n=n;save();closeSheet();render();return}
  if(!n){delete sess(wid).swaps[i];save();closeSheet();render();return}
  sheet(`<h3>Trocar por ${esc(n)}</h3>
   <div class="actions" style="flex-direction:column">
    <button class="btn" onclick="applySwap('${wid}',${i},'${enc}',false)">Só hoje</button>
    <button class="btn sec" onclick="applySwap('${wid}',${i},'${enc}',true)">Trocar sempre neste treino</button>
    <button class="btn ghost" onclick="closeSheet()">Cancelar</button>
   </div>`);
}
function applySwap(wid,i,enc,perm){
  const n=decodeURIComponent(enc); const s=sess(wid);
  if(perm){W(wid).ex[i].n=n;delete s.swaps[i]}else s.swaps[i]=n;
  save();closeSheet();toast(perm?'Treino atualizado':'Trocado só para hoje');render();
}
function pickAny(wid,i,fromToday){
  exPicker(n=>doSwap(wid,i,encodeURIComponent(n),fromToday));
}

/* ---------- Seletor de exercício (com busca e criar novo) ---------- */
let pickCb=null;
function exPicker(cb){
  pickCb=cb;
  sheet(`<h3>Escolher exercício</h3><input id="q" placeholder="Buscar… (ex: rosca, supino)" oninput="fillPick()"><div id="pl" class="list" style="margin-top:10px"></div>
   <hr><div class="muted small">Não achou? Crie um novo:</div>

   <div class="actions"><button class="btn sec" onclick="createEx()">Criar e usar</button></div>`);
  fillPick();

function fillPick(){
  const q=(document.getElementById('q').value||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const p=P(); const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const items=allEx().filter(x=>!q||norm(x.n).includes(q)||norm(GROUPS[x.g]||'').includes(q));
  let h='',g='';
  items.sort((a,b)=>Object.keys(GROUPS).indexOf(a.g)-Object.keys(GROUPS).indexOf(b.g)).forEach(x=>{
    if(x.g!==g){g=x.g;h+=`<div class="muted small" style="margin:10px 0 6px">${GROUPS[g]}</div>`}
    h+=`<button class="item" onclick="pickCb(decodeURIComponent('${encodeURIComponent(x.n)}'))"><span class="grow">${esc(x.n)}${p.avoidLumbar&&x.lomb?' <span class="warn">⚠ lombar</span>':''}</span></button>`});
  document.getElementById('pl').innerHTML=h||'<div class="muted">Nada encontrado.</div>';
}
function createEx(){
  const n=document.getElementById('nn').value.trim(); const g=document.getElementById('ng').value;
  if(!n) return; if(!allEx().some(x=>x.n===n)) S.custom.push({n,g,lomb:false}); save(); pickCb(n);
}

      <button class="mv" onclick="mv('${w.id}',${i},-1)" aria-label="Subir">▲</button><button class="mv" onclick="mv('${w.id}',${i},1)" aria-label="Descer">▼</button></div>
      <div class="grid3" style="margin-top:8px">
        <div><label class="f">Séries</label><input type="number" inputmode="numeric" value="${e.s}" onchange="setEx('${w.id}',${i},'s',+this.value)"></div>

        <div><label class="f">Descanso (s)</label><input type="number" inputmode="numeric" value="${e.rest}" onchange="setEx('${w.id}',${i},'rest',+this.value)"></div>
      </div>
      <label class="f">Observação</label><input value="${esc(e.note||'')}" placeholder="ex: banco no 3" onchange="setEx('${w.id}',${i},'note',this.value)">

  });
  h+=`<button class="btn" onclick="addEx('${w.id}')">+ Adicionar exercício</button>
  <div style="height:12px"></div><button class="btn danger" onclick="rmWorkout('${w.id}')">Excluir treino ${esc(w.id)}</button>`;
  return h;
}
function plannedSets(){
  const p=P(),cnt={};
  p.workouts.forEach(w=>{
    const times=p.mode==='semana'?Object.values(p.schedule).filter(x=>x===w.id).length:1;
    w.ex.forEach(e=>{const g=exInfo(e.n).g;cnt[g]=(cnt[g]||0)+e.s*times})});
  return cnt;
}

function vProg(){
  const p=P(); const hist=p.history;
  const now=new Date(); const ym=today().slice(0,7);
  const month=hist.filter(x=>x.d.startsWith(ym)).length;
  // semanas (segunda a domingo), últimas 12
  const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
  const m0=monday(now); const weeks=[];
  for(let i=11;i>=0;i--){const s=new Date(m0);s.setDate(m0.getDate()-7*i);const e=new Date(s);e.setDate(s.getDate()+7);
    const c=hist.filter(x=>{const d=new Date(x.d+'T12:00');return d>=s&&d<e}).length; weeks.push({s,c})}
  const thisWeek=weeks[11].c; const max=Math.max(4,...weeks.map(w=>w.c));
  const target=p.workouts.length;
  const bw=100/12;
  let svg=`<svg viewBox="0 0 300 150" width="100%" role="img" aria-label="Treinos por semana">`;
  svg+=`<line x1="0" x2="300" y1="${120-target/max*105}" y2="${120-target/max*105}" stroke="#ff7a3d" stroke-dasharray="4 4" opacity=".6"/>`;
  weeks.forEach((w,i)=>{const hgt=w.c/max*105;const x=i*25+5;
    svg+=`<rect x="${x}" y="${120-hgt}" width="15" height="${Math.max(hgt,1)}" rx="3" fill="${i===11?'#3dd6a3':'#4a5868'}"/>`;
    if(w.c) svg+=`<text x="${x+7.5}" y="${115-hgt}" fill="#eef1f5" font-size="10" text-anchor="middle">${w.c}</text>`;
    if(i%2===1||i===11) svg+=`<text x="${x+7.5}" y="138" fill="#9aa5b1" font-size="9" text-anchor="middle">${String(w.s.getDate()).padStart(2,'0')}/${String(w.s.getMonth()+1).padStart(2,'0')}</text>`;});
  svg+='</svg>';
  // sequência de semanas atingindo meta
  let streak=0; for(let i=10;i>=0;i--){if(weeks[i].c>=target)streak++;else break} if(weeks[11].c>=target)streak++;
  let h=`<div class="grid3" style="margin-bottom:12px"><div class="stat"><b>${thisWeek}</b><span class="muted small">esta semana</span></div><div class="stat"><b>${month}</b><span class="muted small">este mês</span></div><div class="stat"><b>${hist.length}</b><span class="muted small">no total</span></div></div>`;
  h+=weekCard();
  h+=compareCard();
  h+=`<div class="card"><h3>Treinos por semana</h3><div class="muted small">Linha laranja = meta de ${target} por semana. Semanas seguidas na meta: ${streak}</div>${svg}</div>`;
  // cargas registradas
  const loads=Object.entries(p.loads).filter(([,a])=>a.length).sort((a,b)=>b[1][b[1].length-1].d.localeCompare(a[1][a[1].length-1].d));
  h+=`<div class="card"><h3>Evolução de carga</h3>${loads.length?loads.map(([n,a])=>{const f=a[0],l=a[a.length-1];const fn=parseFloat(String(f.kg).replace(',','.')),ln=parseFloat(String(l.kg).replace(',','.'));const diff=!isNaN(fn)&&!isNaN(ln)&&a.length>1?ln-fn:null;
     return `<button class="item" style="display:flex;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)" onclick="askLoad('${encodeURIComponent(n)}')"><span style="flex:1">${esc(n)}<br><span class="muted small">${a.length} registro(s) · desde ${fmtDate(f.d)}</span></span><span style="text-align:right"><b class="load">${esc(l.kg)} kg</b>${diff!==null?`<br><span class="small" style="color:${diff>=0?'var(--accent2)':'var(--danger)'}">${diff>=0?'+':''}${+diff.toFixed(1)} kg</span>`:''}</span></button>`}).join(''):'<p class="muted">Nenhuma carga registrada ainda. Toque em "Registrar carga" num exercício.</p>'}</div>`;
  h+=`<div class="card"><h3>Últimos treinos</h3>${hist.slice(-15).reverse().map((x,k)=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="pill acc">${esc(x.w)}</span><span style="flex:1">${esc(x.t||'')}</span><span class="muted small">${fmtDate(x.d)}</span><button class="mv" onclick="rmHist(${hist.length-1-k})" aria-label="Apagar">✕</button></div>`).join('')||'<p class="muted">Nada ainda. Conclua um treino na aba Hoje.</p>'}</div>`;
  return h;
}
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function weekStatus(){
  const p=P(),plan=plannedSets(),ws=ds(weekStart()),done={},left={};
  p.history.filter(x=>x.d>=ws).forEach(x=>{const g=x.g||groupSets((W(x.w)||{ex:[]}).ex);for(const k in g)done[k]=(done[k]||0)+g[k]});
  // o que ainda está agendado nos próximos dias desta semana (modo por dia da semana)
  if(p.mode==='semana'){const did=p.history.some(x=>x.d===today());const n=7-((new Date().getDay()+6)%7);
    for(let i=did?1:0;i<n;i++){const d=new Date();d.setDate(d.getDate()+i);const w=W(p.schedule[d.getDay()]);
      if(w){const g=groupSets(w.ex);for(const k in g)left[k]=(left[k]||0)+g[k]}}}
  return MAIN.map(g=>{const target=Math.max(10,plan[g]||0);return {g,target,done:done[g]||0,left:left[g]||0}});
}
function weekHint(wid){

  return `<div class="card"><h3>${st.map(x=>esc(x.name.split(' ')[0])).join(' x ')} · últimas 4 semanas</h3>
   <div class="muted small">Para ser justo, o volume é dividido pelo peso de cada um e a evolução é em % sobre a própria carga inicial.</div>

function mergeProfile(loc,rem,mine){

  out.history=Object.entries(hm).filter(([k])=>!del.includes(k)).map(([,x])=>x).sort((a,b)=>a.d.localeCompare(b.d));
  out.delHist=del;
  const L={};[other.loads||{},out.loads||{}].forEach(src=>{for(const n in src){L[n]=L[n]||{};src[n].forEach(x=>L[n][x.d]=x)}});
  out.loads={};for(const n in L) out.loads[n]=Object.values(L[n]).sort((a,b)=>a.d.localeCompare(b.d));
  return out;
}
function mergeAll(rem){
  const own=S.sync.owner, keys=new Set([...Object.keys(S.profiles),...Object.keys(rem.profiles||{})]);
  const profiles={};keys.forEach(k=>profiles[k]=mergeProfile(S.profiles[k],(rem.profiles||{})[k],k===own));
  const im={};[...(rem.ideas||[]),...(S.ideas||[])].forEach(x=>{im[x.id]=im[x.id]?{...x,sent:im[x.id].sent||x.sent}:x});
  const cm={};[...(rem.custom||[]),...(S.custom||[])].forEach(x=>cm[x.n]=x);
  return {profiles,ideas:Object.values(im).sort((a,b)=>a.id-b.id),custom:Object.values(cm)};
}
let syncT=null,syncing=false;
function syncSoon(){if(!S.sync||!S.sync.token||!S.sync.owner)return;clearTimeout(syncT);syncT=setTimeout(syncNow,2500)}
async function gh(method,body){
  const r=await fetch(`https://api.github.com/repos/${S.sync.repo}/contents/${FILE}`+(method==='GET'?'?t='+Date.now():''),{method,cache:'no-store',
    headers:{Authorization:'Bearer '+S.sync.token,Accept:'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
  return r;
}
async function syncNow(manual){
  if(!S.sync||!S.sync.token||!S.sync.owner||syncing)return;
  if(!navigator.onLine){if(manual)toast('Sem internet. Sincroniza quando voltar.');return}
  syncing=true;
  try{
    for(let tryN=0;tryN<2;tryN++){
      const g=await gh('GET');let rem={profiles:{}},sha;
      if(g.status===200){const j=await g.json();sha=j.sha;rem=JSON.parse(b64d(j.content))}
      else if(g.status!==404) throw g.status;
      const m=mergeAll(rem);
      const before=JSON.stringify(payload());
      S.profiles=m.profiles;S.ideas=m.ideas;S.custom=m.custom;
      const next=payload();
      const remStr=JSON.stringify({v:rem.v,profiles:rem.profiles,ideas:rem.ideas||[],custom:rem.custom||[]});
      if(JSON.stringify(next)!==remStr){
        const p=await gh('PUT',{message:'Sincronização '+S.profiles[S.sync.owner].name,content:b64e(JSON.stringify(next,null,1)),...(sha?{sha}:{})});
        if(p.status===409||p.status===422){continue}
        if(!p.ok) throw p.status;
      }
      S.sync.last=Date.now();S.sync.err=null;save(true);
      const typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      if((JSON.stringify(payload())!==before||view==='ajustes')&&!document.querySelector('.sheet')&&!typing) render();
      if(manual)toast('Sincronizado');
      break;
    }
  }catch(e){
    S.sync.err=e===401||e===403?'Token inválido ou expirado':e===404?'Repositório não encontrado (confira o nome e as permissões do token)':'Não consegui sincronizar agora';
    save(true);if(manual)toast(S.sync.err);if(view==='ajustes'&&!document.querySelector('.sheet'))render();
  }finally{syncing=false}
}
function syncCard(){
  const c=S.sync||{};const names=Object.entries(S.profiles);
  if(!c.token) return `<details class="card"><summary style="font-weight:650;cursor:pointer">Juntar com o outro celular</summary>
    <p class="muted small">Liga a sincronização para o comparativo e o histórico dos dois aparecerem nos dois celulares. Se o outro celular mandou um link, é só abrir o link.</p>
    <label class="f">Repositório de dados</label><input id="sy-repo" value="vvisualfilms-brasil/kusunoki-dados">
    <label class="f">Token do GitHub</label><input id="sy-token" type="password" placeholder="github_pat_… ou o link do outro celular" autocomplete="off">
    <label class="f">Este celular é de</label><select id="sy-own">${names.map(([k,p])=>`<option value="${k}" ${k===S.active?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    <div class="actions"><button class="btn sm" onclick="syncSetup()">Ligar sincronização</button></div></details>`;
  const when=c.last?new Date(c.last).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'ainda não';
  return `<div class="card"><h3>Sincronização</h3>
    <div class="small" style="margin-top:4px">Este celular é de <b>${esc((S.profiles[c.owner]||{}).name||'?')}</b> · ${c.err?`<span style="color:var(--danger)">${esc(c.err)}</span>`:`sincronizado: ${when}`}</div>
    <div class="actions"><button class="btn sec sm" onclick="syncNow(true)">Sincronizar agora</button><button class="btn sec sm" onclick="shareSync()">Link para o outro celular</button><button class="btn ghost sm" onclick="ask('Desligar a sincronização neste celular? Os dados continuam aqui.','Desligar',()=>{delete S.sync;save(true);render()})">Desligar</button></div></div>`;
}
function syncSetup(){
  const repo=document.getElementById('sy-repo').value.trim().replace(/^https?:\/\/github.com\//,'').replace(/\/$/,''),token=document.getElementById('sy-token').value.trim(),owner=document.getElementById('sy-own').value;
  const lm=token.match(/#sync=([^\s]+)/);if(lm){try{const c=JSON.parse(b64d(decodeURIComponent(lm[1])));S.sync={repo:c.repo,token:c.token,owner};S.active=owner;save(true);render();syncNow(true);return}catch(e){toast('Link inválido');return}}
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!token){toast('Preencha o repositório e o token');return}
  S.sync={repo,token,owner};S.active=owner;save(true);render();syncNow(true);
}
async function shareSync(){
  const url=location.origin+location.pathname+'#sync='+b64e(JSON.stringify({repo:S.sync.repo,token:S.sync.token}));
  const text='Abra este link no seu celular para juntar os treinos no Kusunoki Fitness (não compartilhe com mais ninguém):\n'+url;
  if(navigator.share){try{await navigator.share({text});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(url);toast('Link copiado')}catch(e){sheet(`<h3>Envie este link para o outro celular</h3><textarea style="min-height:140px">${esc(url)}</textarea><div class="actions"><button class="btn" onclick="closeSheet()">Fechar</button></div>`)}
}
function pairFromHash(){
  const m=location.hash.match(/^#sync=(.+)$/);if(!m)return;
  history.replaceState(null,'',location.pathname);
  try{const c=JSON.parse(b64d(decodeURIComponent(m[1])));if(!c.token)throw 0;
    view='ajustes';
    setTimeout(()=>sheet(`<h3>Juntar os treinos</h3><p class="muted">De quem é este celular?</p><div class="list">${Object.entries(S.profiles).map(([k,p])=>`<button class="item" onclick="S.sync={repo:'${esc(c.repo)}',token:'${esc(c.token)}',owner:'${k}'};S.active='${k}';save(true);closeSheet();render();syncNow(true)"><span class="grow">${esc(p.name)}</span></button>`).join('')}</div>`),0);
  }catch(e){toast('Link de sincronização inválido')}
}
pairFromHash();
render();
syncSoon();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncSoon()});
window.addEventListener('online',syncSoon);
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#sync=')){pairFromHash();render()}});
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
